<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Получен новый значок!</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ================= БАЗОВЫЕ НАСТРОЙКИ ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comfortaa', sans-serif;
        }

        body {
            /* Мягкий, переливающийся градиент, как в iOS */
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 50%, #e0c3fc 100%);
            background-size: 300% 300%;
            animation: gradientFlow 15s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ================= АНИМАЦИЯ ЧАСТИЦ НА ФОНЕ ================= */
        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: floatUp linear infinite;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }

        /* ================= ОСНОВНАЯ КАРТОЧКА ================= */
        .glass-card {
            position: relative;
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 40px;
            padding: 50px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1), inset 0 0 20px rgba(255, 255, 255, 0.5);
            z-index: 2;
            
            /* Начальное состояние для анимации появления (появление карточки) */
            transform: scale(0.5) rotateX(20deg);
            opacity: 0;
            animation: cardAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes cardAppear {
            to {
                transform: scale(1) rotateX(0deg);
                opacity: 1;
            }
        }

        /* ================= ЗНАЧОК (ЭМОДЗИ) ================= */
        .badge-icon {
            font-size: 110px;
            line-height: 1;
            margin-bottom: 20px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15));
            opacity: 0;
            
            /* Запуск анимации: вылет + пружинистый отскок + бесконечное парение */
            animation: 
                iconPop 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards,
                floating 4s ease-in-out 1.5s infinite;
        }

        @keyframes iconPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes floating {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* ================= ТЕКСТ ================= */
        .title {
            font-size: 32px;
            color: #2d3748;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.2;
            
            opacity: 0;
            transform: translateY(20px);
            animation: textSlideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.8s forwards;
        }

        .subtitle {
            font-size: 18px;
            color: #4a5568;
            font-weight: 400;
            opacity: 0;
            transform: translateY(20px);
            animation: textSlideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 1.1s forwards;
        }

        @keyframes textSlideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= СВЕТОВОЙ БЛИК (Shimmer) ================= */
        .glass-card::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(
                to right, 
                rgba(255,255,255,0) 0%, 
                rgba(255,255,255,0.4) 50%, 
                rgba(255,255,255,0) 100%
            );
            transform: rotate(30deg) translateX(-100%);
            z-index: 10;
            pointer-events: none;
            /* Запуск блика после появления */
            animation: shimmer 3s ease-in-out 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: rotate(30deg) translateX(-100%); }
            50%, 100% { transform: rotate(30deg) translateX(100%); }
        }

        /* ================= КНОПКА (ОПЦИОНАЛЬНО) ================= */
        .action-btn {
            margin-top: 40px;
            padding: 15px 40px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(255, 255, 255, 1);
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            color: #2b6cb0;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(43, 108, 176, 0.15);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            opacity: 0;
            transform: translateY(20px);
            animation: textSlideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 1.4s forwards;
        }

        .action-btn:hover {
            background: #ffffff;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 30px rgba(43, 108, 176, 0.25);
        }

        .action-btn:active {
            transform: translateY(0) scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Контейнер для летающих частиц -->
    <div class="particles" id="particles"></div>

    <!-- Основная карточка -->
    <div class="glass-card">
        <div class="badge-icon">🧶</div>
        <div class="title">ты получаешь значок клубка</div>
        <div class="subtitle">за большой вклад в инжемир</div>
        
        <!-- Кнопка (можешь убрать, если не нужна) -->
        <button class="action-btn" onclick="window.history.back()">Вернуться назад</button>
    </div>

    <script>
        // ================= ГЕНЕРАТОР ЧАСТИЦ =================
        // Создает красивые летающие пузырьки на фоне
        const particleContainer = document.getElementById('particles');
        const particleCount = 25; // Количество частиц

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Случайный размер
            const size = Math.random() * 20 + 5;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            // Случайная позиция по горизонтали
            particle.style.left = `${Math.random() * 100}%`;
            
            // Случайная задержка и скорость
            const delay = Math.random() * 10;
            const duration = Math.random() * 10 + 10;
            
            particle.style.animationDelay = `${delay}s`;
            particle.style.animationDuration = `${duration}s`;
            
            particleContainer.appendChild(particle);
        }
    </script>
</body>
</html>
