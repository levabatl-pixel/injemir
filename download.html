<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скачать ИНЖЕМИР V3</title>

    <style>
        /* Базовые настройки */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Impact', 'Arial Black', sans-serif;
            user-select: none;
            letter-spacing: 0.5px;
        }

        body {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            background-size: 200% 200%;
            animation: gradientBG 20s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .download-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 35px;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
        }

        .download-logo {
            font-size: 42px;
            color: #1a202c;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .download-title {
            font-size: 24px;
            color: #2d3748;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 30px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }

        /* Андроид — основная кнопка */
        .download-btn.android {
            background: #2b6cb0;
            color: #ffffff;
            border: none;
            box-shadow: 0 5px 15px rgba(43, 108, 176, 0.3);
        }

        .download-btn.android:hover {
            background: #1a365d;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(43, 108, 176, 0.4);
        }

        .download-btn.android:active { transform: scale(0.97); }

        /* iOS — неактивная */
        .download-btn.ios {
            background: rgba(255, 255, 255, 0.7);
            color: #718096;
            border: 2px solid rgba(160, 174, 192, 0.5);
            cursor: not-allowed;
        }

        .download-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .download-note {
            font-size: 13px;
            color: #718096;
            font-weight: 600;
            margin-top: 15px;
        }

        /* ТОСТ */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(45, 55, 72, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(45, 55, 72, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 200;
            white-space: nowrap;
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="download-card">
        <div class="download-logo">ИНЖЕМИР V3</div>
        <div class="download-title">скачать приложение<br>инжемирv3 на телефон</div>

        <!-- Файл "инжемир v3.apk" должен лежать рядом с этой страницей -->
        <a class="download-btn android" href="инжемир%20v3.apk" download>
            <svg viewBox="0 0 24 24"><path d="M17 18c.56 0 1 .44 1 1s-.44 1-1 1-1-.44-1-1 .44-1 1-1zm0-3c2.07 0 3.75 1.68 3.75 3.75S19.07 22.5 17 22.5s-3.75-1.68-3.75-3.75S14.93 15 17 15zM2 15v3c0 2.21 1.79 4 4 4h2v-2H6c-1.1 0-2-.9-2-2v-3H2zm4-6H4v3c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V9h-2v3H6V9zm10-7H8c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 11H8V4h8v9z"/></svg>
            Скачать на Android
        </a>

        <div class="download-btn ios" onclick="showIosToast()">
            <svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
            Скачать на IOS (скоро будет)
        </div>

        <div class="download-note">файл скачается на устройство автоматически</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.classList.add('show');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showIosToast() {
            showToast('версия для IOS скоро появится');
        }
    </script>
</body>
</html>
